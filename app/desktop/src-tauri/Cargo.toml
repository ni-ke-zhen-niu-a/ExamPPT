[package]
name = "examppt-desktop"
version = "0.0.1"
description = "ExamPPT desktop app"
authors = ["ExamPPT contributors"]
edition = "2021"

[lib]
name = "examppt_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
