name: Windows GUI Build

on:
  workflow_dispatch:
  push:
    branches:
      - gui-v0.1
    paths:
      - "app/desktop/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/windows-gui.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python core
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build_sidecar.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri NSIS installer
        working-directory: app/desktop
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ExamPPT-Windows-GUI
          path: |
            app/desktop/src-tauri/target/release/*.exe
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
